# apphosting.yaml
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: AIRTABLE_PAT
    secret: AIRTABLE_PAT
  - variable: AIRTABLE_BASE_ID
    value: "appYOQPX3ZUufLWbs"
  - variable: AIRTABLE_TABLE_NAME
    value: "tblx5jtaQDsgqZICZ"
  - variable: KEYSTATIC_GITHUB_CLIENT_ID
    secret: KEYSTATIC_GITHUB_CLIENT_ID
  - variable: KEYSTATIC_GITHUB_CLIENT_SECRET
    secret: KEYSTATIC_GITHUB_CLIENT_SECRET
  - variable: KEYSTATIC_SECRET
    secret: KEYSTATIC_SECRET
  - variable: PUBLIC_KEYSTATIC_PROJECT
    value: "avantia-landing-page/avantia-landing-page"
